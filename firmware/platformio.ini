; This machine's camera board enumerates as COM3, USB-Enhanced-SERIAL CH343.
; Serial is UART0 on that adapter. Flash mode is DIO. The camera pins are the ESP32-S3-EYE set.
; The vision pipeline is the ceiling hand tracker (grayscale QQVGA, background subtraction).

[platformio]
src_dir = FittsHandTracker

[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 8MB
upload_port = COM3
monitor_port = COM3
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0